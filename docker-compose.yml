services:
  minivid:
    image: ghcr.io/aerya/minivid:latest
    container_name: minivid
    restart: unless-stopped
    env_file: .env
    ports:
      - "${MINIVID_PORT:-8080}:8080"
    volumes:
      # Adaptez les chemins hôtes et ajoutez ou retirez des sources si nécessaire.
      - /chemin/vers/videos1:/videos1:ro
      - /chemin/vers/videos2:/videos2:ro
      - ./data:/data
      - ./cache:/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    # NVIDIA NVENC (facultatif) : décommentez les deux lignes suivantes.
    # gpus: all
    # environment:
    #   NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
